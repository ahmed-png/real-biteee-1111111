# ════════════════════════════════════════════════════
#  render.yaml — إعداد نشر البوت على Render تلقائياً
# ════════════════════════════════════════════════════
services:
  - type: web
    name: my-real-bot
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production
      - key: DISCORD_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DASHBOARD_KEY
        sync: false
